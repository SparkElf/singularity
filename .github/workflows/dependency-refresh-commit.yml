name: One-shot dependency metadata refresh

on:
  push:
    branches:
      - infra/canonical-ci-release
    paths:
      - .github/workflows/dependency-refresh-commit.yml

permissions:
  contents: write

concurrency:
  group: singularity-one-shot-dependency-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ github.repository == 'SparkElf/singularity' && github.ref == 'refs/heads/infra/canonical-ci-release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          ref: infra/canonical-ci-release
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 11.9.0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24

      - name: Generate enterprise lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
        working-directory: enterprise

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.26.6
          cache-dependency-path: kernel/go.sum

      - name: Generate Go module metadata
        run: |
          go get golang.org/x/mod@v0.40.0
          go mod tidy
        working-directory: kernel

      - name: Verify generated change boundary
        run: |
          set -euo pipefail
          allowed='^(.github/workflows/dependency-refresh-commit.yml|enterprise/pnpm-lock.yaml|kernel/go.mod|kernel/go.sum)$'
          unexpected="$(git status --short | awk '{print $2}' | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected dependency refresh changes:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          grep -F "golang.org/x/mod v0.40.0" kernel/go.mod >/dev/null
          grep -F "react-router:" enterprise/pnpm-lock.yaml >/dev/null
          grep -F "version: 8.3.0" enterprise/pnpm-lock.yaml >/dev/null

      - name: Commit generated metadata and remove this workflow
        run: |
          set -euo pipefail
          rm .github/workflows/dependency-refresh-commit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add enterprise/pnpm-lock.yaml kernel/go.mod kernel/go.sum .github/workflows/dependency-refresh-commit.yml
          git diff --cached --check
          git commit -m "chore(security): refresh patched dependency metadata"
          git push origin HEAD:infra/canonical-ci-release
