name: Singularity Governance

on:
  pull_request:
    types: [opened, edited, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  pr-evidence:
    if: ${{ github.repository == 'SparkElf/singularity' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify independent repository and minimal PR evidence
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            if (context.payload.repository?.fork) {
              core.setFailed('Canonical Singularity must be an independent GitHub repository, not a fork-network repository.')
              return
            }
            const body = context.payload.pull_request?.body || ''
            const required = [
              '## At a glance',
              '## MVP classification',
              '## Verification',
              '## Related issue',
            ]
            const missing = required.filter((heading) => !body.includes(heading))
            if (missing.length) core.setFailed('Missing required pull request sections: ' + missing.join(', '))

  metadata:
    if: ${{ github.repository == 'SparkElf/singularity' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 11.9.0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: enterprise/pnpm-lock.yaml

      - name: Install governance dependencies
        run: pnpm install --frozen-lockfile
        working-directory: enterprise

      - name: Verify independent repository governance
        env:
          SINGULARITY_GOVERNANCE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SINGULARITY_GOVERNANCE_HEAD_SHA: ${{ github.sha }}
        run: node scripts/singularity/verify-independent-governance.mjs
