name: Bootstrap patch canonical L0

on:
  push:
    branches: [bootstrap/canonical-import]
    paths:
      - .github/workflows/bootstrap-patch-l0.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.repository == 'SparkElf/singularity' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout import branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 1

      - name: Generate canonical-main L0 as ordinary content
        run: |
          node --input-type=module <<'NODE'
          import { mkdirSync, readFileSync, writeFileSync } from "node:fs";
          const sourcePath = ".github/workflows/singularity-l0.yml";
          let source = readFileSync(sourcePath, "utf8");
          const branchBefore = '  push:\n    branches:\n      - master\n';
          const branchAfter = '  push:\n    branches:\n      - main\n';
          if (!source.includes(branchBefore)) throw new Error("canonical L0 branch marker not found");
          source = source.replace(branchBefore, branchAfter);
          const nameBefore = "      - name: Verify fork governance\n";
          const nameAfter = "      - name: Verify upstream and repository governance\n";
          if (!source.includes(nameBefore)) throw new Error("legacy governance step name not found");
          source = source.replace(nameBefore, nameAfter);
          mkdirSync("bootstrap", { recursive: true });
          writeFileSync("bootstrap/singularity-l0-main.yml", source, "utf8");
          NODE

      - name: Publish generated ordinary file to import branch
        run: |
          git config user.name "Singularity Bootstrap"
          git config user.email "bootstrap@users.noreply.github.com"
          git add bootstrap/singularity-l0-main.yml
          git commit -m "chore: generate canonical-main L0 workflow"
          git push origin HEAD:bootstrap/canonical-import
