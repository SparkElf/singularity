version: 1
records:
  - id: enterprise-knowledge-base-platform
    status: active
    title: Singularity enterprise knowledge-base platform
    capability:
      - Organization, identity, space, sharing, permission, collaboration, export, discovery, governance, and enterprise web/API/worker capabilities owned by Singularity.
    source:
      repository: SparkElf/singularity
      relationship: product-owned
    paths:
      - enterprise/**
      - config/**
    owner: enterprise-platform
    compatibility: >-
      Enterprise services extend the SiYuan knowledge workspace without replacing the native editor/content owner. Equivalent capabilities introduced by future SiYuan releases must be reviewed for adoption or local retirement during upstream promotion.
    verification:
      - cd enterprise && pnpm verify:b4
      - cd enterprise && pnpm verify:s0-s3
      - cd enterprise && pnpm test:e2e

  - id: independent-repository-governance
    status: active
    title: Independent repository, upstream tracking, AI engineering governance, and release policy
    capability:
      - Maintain Singularity as an independently discoverable repository with explicit SiYuan baseline tracking, divergence records, AI development skills, controlled upstream promotion, CI evidence, and product-owned release governance.
    source:
      repository: SparkElf/singularity
      relationship: product-owned
    paths:
      - .agents/**
      - .github/**
      - DIFFS.md
      - upstream/**
      - diffs/**
      - docs/**
      - plans/**
      - scripts/singularity/**
      - README*.md
      - NOTICE
      - Dockerfile*
    owner: repository-governance
    compatibility: >-
      Repository identity is independent from GitHub's SiYuan fork network while attribution and AGPL-3.0 obligations remain explicit. Upstream integration occurs through pinned baselines and reviewed promotion candidates.
    verification:
      - node scripts/singularity/verify-upstream-baseline.mjs
      - cd enterprise && pnpm run test:l0-governance
