version: 1
records:
  - id: siyuan-native-app-divergence-bootstrap
    status: active
    title: Native SiYuan workspace and Protyle integration divergence bootstrap
    capability:
      - Preserve the SiYuan-native workspace while exposing Singularity enterprise entry points and browser/editor integration seams.
      - Carry the pre-governance native-app refactors already present in Singularity until they are decomposed into capability-specific records.
    source:
      repository: siyuan-note/siyuan
      baseline_version: 3.7.2
      baseline_commit: c8dcdd0860ef000a14552c619fe19c0dcb5175f5
    paths:
      - app/**
    owner: upstream-integration
    compatibility: >-
      SiYuan remains the native workspace and editor owner. Singularity-specific native changes must stay narrow enough to re-evaluate on every SiYuan promotion; new work should create capability-specific records instead of expanding this bootstrap record.
    verification:
      - cd app && pnpm run lint
      - cd enterprise && pnpm verify:b4
      - cd enterprise && pnpm verify:s0-s3
    notes:
      - The initial baseline-to-Singularity comparison is 131 commits ahead of SiYuan 3.7.2 and contains a broad native-app refactor surface.
      - Decompose this bootstrap record as touched areas are next modified or promoted upstream.

  - id: protyle-browser-runtime-integration-seam
    status: active
    title: Protyle browser runtime and overlay lifecycle integration seam
    capability:
      - Expose the real SiYuan Protyle runtime to Singularity enterprise browser surfaces while keeping document identity, drag state, overlays, dialogs, and image-preview cleanup owned by the native editor runtime.
      - Preserve explicit ambient SiYuan type assembly at the browser runtime entry instead of inventing a parallel browser type model.
    source:
      repository: siyuan-note/siyuan
      baseline_version: 3.7.2
      baseline_commit: c8dcdd0860ef000a14552c619fe19c0dcb5175f5
    paths:
      - app/eslint.config.mjs
      - app/src/protyle/browser-entry.ts
      - app/src/protyle/preview/image.ts
      - app/src/protyle/ui/dragState.ts
      - app/src/protyle/ui/touchDragState.ts
      - app/src/protyle/wysiwyg/dialogOwner.ts
    owner: upstream-integration
    compatibility: >-
      These files are SiYuan-derived editor/runtime surfaces. Callback-owned handles intentionally use delayed single assignment where lifecycle callbacks must capture the same handle before registration completes; the browser entry intentionally references SiYuan ambient declarations. Re-evaluate both assumptions during every SiYuan promotion touching these files.
    verification:
      - cd app && pnpm run lint
      - cd app && pnpm test
      - cd enterprise && pnpm verify:b4
    notes:
      - This record decomposes the touched Protyle browser/overlay area from the native-app bootstrap record without changing the promoted SiYuan baseline.
